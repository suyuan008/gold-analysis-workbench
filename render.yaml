services:
  - type: web
    name: gold-analysis-workbench
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: PGSSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: gold-analysis-db
          property: connectionString
databases:
  - name: gold-analysis-db
    databaseName: gold_analysis
    user: gold_analysis
    plan: free
